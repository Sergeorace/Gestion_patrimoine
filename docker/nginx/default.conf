# =============================================================================
# API Gateway - Nginx
# Routage /api/v1/<domaine>/* vers le micro-service correspondant.
# Verification JWT confiee aux services (cle publique partagee).
# =============================================================================

# Map des prefixes d'API vers les services internes
map $uri $api_upstream {
    ~^/api/v1/auth/          http://auth-service:8000;
    ~^/api/v1/organisation/ http://organisation-service:8000;
    ~^/api/v1/org/          http://organisation-service:8000;
    ~^/api/v1/assets        http://asset-service:8000;
    ~^/api/v1/movements     http://movement-service:8000;
    ~^/api/v1/inventories   http://inventory-service:8000;
    ~^/api/v1/maintenance   http://maintenance-service:8000;
    ~^/api/v1/valorisation  http://valuation-service:8000;
    ~^/api/v1/documents     http://document-service:8000;
    ~^/api/v1/notifications http://notification-service:8000;
    ~^/api/v1/reports       http://reporting-service:8000;
    default                 http://web-app:3000;
}

# Rate limiting : zones memoire (valeurs ajustables)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    # Securite de base
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 20m;

    # --- API REST -> micro-services -------------------------------------------
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 30s;
    }

    # --- Web app (Inertia/Vue) -------------------------------------------------
    location / {
        proxy_pass http://web-app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- Healthcheck gateway ----------------------------------------------------
    location /health {
        access_log off;
        return 200 '{"status":"ok","service":"api-gateway"}';
        add_header Content-Type application/json;
    }
}
